name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: celldeep-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: celldeep-tool/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      # Tests run in a network namespace with no interfaces, so any real API or network call fails.
      - name: Run full test suite without network
        run: |
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" "HOME=$HOME" \
            ANTHROPIC_API_KEY=offline-mocked-key bash -c '
              if python -c "import socket; socket.create_connection((\"pypi.org\", 443), 3)" 2>/dev/null; then
                echo "Network is reachable inside the test sandbox" >&2; exit 1
              fi
              python -m pytest -q'
