services:
  - type: web
    name: celldeep-report-generator
    env: python
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: FLASK_SECRET_KEY
        generateValue: true
