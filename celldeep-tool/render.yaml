services:
  - type: web
    name: celldeep-report-generator
    env: python
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 1000 --worker-class gthread --threads 4"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # Stable session-signing key shared by every worker and restart (falls back to one derived from
      # CELLDEEP_STAFF_PASSWORD when unset).
      - key: CELLDEEP_SECRET_KEY
        generateValue: true
      # Shared staff password for the whole site; set it in the Render dashboard, never in code.
      - key: CELLDEEP_STAFF_PASSWORD
        sync: false
