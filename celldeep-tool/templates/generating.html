<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generating Report | CellDeep</title>
  <style>
    body { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #373436; }
    h1 { font-family: Georgia, serif; font-size: 22px; }
    #status { color: #5A5A5A; font-size: 15px; }
    .result { border: 1px solid #6FA287; background: #6FA28718; padding: 16px; border-radius: 6px; }
    .error { border: 1px solid #B75B4E; color: #7a3a30; padding: 16px; border-radius: 6px; }
    a { color: #3E7C93; font-weight: 700; }
    .confirm { border: 1px solid #C9A23B; background: #C9A23B14; padding: 16px; border-radius: 6px; }
    .confirm li { margin-top: 6px; font-size: 14px; }
    .confirm button { margin: 12px 8px 0 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .confirm h2 { font-size: 14px; margin: 14px 0 0; }
    .summary { font-size: 13px; margin: 8px 0; }
    #banner { font-size: 13px; color: #3E7C93; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Generating your report...</h1>
  <div id="banner"></div>
  <div id="status" data-job-id="{{ job_id }}">Your files are being processed.</div>
  <script>
    const statusUrl = {{ url_for('generate_status', job_id=job_id)|tojson }};
    const statusElement = document.getElementById('status');
    const interruptedMessage = {{ interrupted_message|tojson }};
    const decisionUrl = {{ url_for('generate_decision', job_id=job_id)|tojson }};

    async function decide(action) {
      statusElement.className = '';
      statusElement.textContent = action === 'stop' ? 'Stopping...' : 'Generating your report...';
      const body = new FormData();
      body.append('action', action);
      await fetch(decisionUrl, {method: 'POST', body});
      window.setTimeout(checkStatus, 500);
    }

    function addList(parent, heading, items) {
      if (!items || !items.length) return;
      if (heading) {
        const title = document.createElement('h2');
        title.textContent = heading;
        parent.appendChild(title);
      }
      const list = document.createElement('ul');
      for (const item of items) {
        const entry = document.createElement('li');
        entry.textContent = item;
        list.appendChild(entry);
      }
      parent.appendChild(list);
    }

    function showBanner(lines) {
      const banner = document.getElementById('banner');
      banner.textContent = '';
      for (const line of lines || []) {
        const entry = document.createElement('div');
        entry.textContent = line;
        banner.appendChild(entry);
      }
    }

    function showConfirmation(job) {
      statusElement.className = 'confirm';
      statusElement.textContent = '';
      const titles = {
        review: 'Some pages or rows will be left out of this report. Check them before continuing:',
        date: 'The entered Collected date does not match the lab report.',
        name: 'The entered name does not match the name printed on the lab report.',
      };
      const title = document.createElement('strong');
      title.textContent = titles[job.kind || 'review'] || titles.review;
      statusElement.appendChild(title);
      if (job.summary) {
        const summary = document.createElement('div');
        summary.className = 'summary';
        summary.textContent = job.summary;
        statusElement.appendChild(summary);
      }
      if (job.message) addList(statusElement, '', [job.message]);
      if ((job.kind || 'review') === 'review') {
        const known = job.known || [];
        addList(statusElement, known.length ? 'Needs review' : '', known.length ? job.needs_review : job.items);
        addList(statusElement, 'Known (auto-handled)', known);
      }
      const choices = job.choices || [{action: 'continue', label: 'Generate the report without them'},
                                      {action: 'stop', label: 'Stop, I will fix the files'}];
      for (const choice of choices) {
        const button = document.createElement('button');
        button.textContent = choice.label;
        button.onclick = () => decide(choice.action);
        statusElement.appendChild(button);
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch(statusUrl, {cache: 'no-store'});
        if (response.status === 404) {
          // The job no longer exists: its instance was killed or restarted. Stop polling.
          statusElement.className = 'error';
          statusElement.textContent = interruptedMessage;
          return;
        }
        const job = await response.json();
        showBanner(job.banner);
        if (job.status === 'interrupted') {
          statusElement.className = 'error';
          statusElement.textContent = interruptedMessage;
          return;
        }
        if (job.status === 'confirm') {
          showConfirmation(job);
          return;  // polling resumes after staff decide
        }
        if (job.status === 'stopped') {
          statusElement.className = 'error';
          statusElement.textContent = job.error;
          return;
        }
        if (job.status === 'done') {
          statusElement.className = 'result';
          statusElement.innerHTML = '<strong>Report generated.</strong><br><a href="' + job.report_url + '">Download patient report</a><br><a href="' + job.review_notes_url + '">Download internal QA file</a>';
          return;
        }
        if (job.status === 'error') {
          statusElement.className = 'error';
          statusElement.textContent = job.error;
          return;
        }
      } catch (_error) {
        statusElement.textContent = 'Still generating your report...';
      }
      window.setTimeout(checkStatus, 1500);
    }

    checkStatus();
  </script>
</body>
</html>
